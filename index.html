<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Geodesic Dome</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="info">
        Double-click on a face to view/add notes.
        <br>
        Drag to rotate. Scroll to zoom.
        <br>
        <label for="method-selector">Geodesic Method:
            <select id="method-selector">
                <option value="1">Method 1 (Three.js Icosahedron)</option>
                <option value="2">Method 2 (Physical Kit Spec)</option>
                <option value="3">Method 3 (V2 with 2 chord lengths)</option>
                <option value="4">Method 4 (Physical Construction Sequence)</option>
                <option value="5">Method 5 (3D Trigonometric Constraints)</option>
                <option value="6">Method 6 (Method 1 + Flat Equator)</option>
                <option value="7">Method 7 (3 Layers: Decagon-Decagon-Pentagon-Apex)</option>
                <option value="8">Method 8 (Exact Hubs Kit - 6x5way, 20x6way)</option>
                <option value="9">Method 9 (30 Pentagons - Design Plan View)</option>
                <option value="10" selected>Method 10 (1 Apex + 5 Bottom Ring Pentagons)</option>
            </select>
        </label>
    </div>
    <div id="canvas-container">
        <canvas id="domeCanvas"></canvas>
    </div>
    <div id="label-container"></div>

    <div id="textModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modalTitle">Face Information</h3>
            <p id="modalExistingText" style="white-space: pre-wrap;"></p>
            <textarea id="modalTextInput" rows="4" placeholder="Add your notes for this face..."></textarea>
            <button id="saveTextButton">Save Note</button>
            <button id="clearTextButton">Clear Note</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
